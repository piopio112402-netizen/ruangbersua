<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Bersua - Photobox System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#FAF7F2',
                            primary: '#2C2A29',
                            accent: '#D9C5B2',
                            card: '#FFFFFF',
                            sage: '#8A9A86'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .flash-overlay {
            animation: flashAnim 0.4s ease-out;
        }
        @keyframes flashAnim {
            0% { opacity: 1; background-color: white; }
            100% { opacity: 0; background-color: transparent; }
        }
    </style>
</head>

            <span class="text-2xl font-serif font-bold tracking-wider text-brand-primary">Ruang Bersua.</span>
            <span class="text-xs bg-stone-200 text-stone-600 px-2 py-0.5 rounded-full uppercase tracking-widest font-semibold">Studio</span>
        </div>
        <div id="step-indicator" class="hidden text-xs tracking-widest uppercase text-stone-400 font-semibold">
